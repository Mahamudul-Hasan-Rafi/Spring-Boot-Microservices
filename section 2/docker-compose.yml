services:
  accounts:
    build:
      context: ./accounts
      dockerfile: Dockerfile
    container_name: accounts_ms
    ports:
      - 8080:8080
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 256M
    networks:
      - accounts_net

