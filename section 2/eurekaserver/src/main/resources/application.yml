server:
  port: 8761

spring:
  application:
    name: eurekaserver
  config:
    import: configserver:http://myuser:mypassword@localhost:8071/
    fail-fast: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true


