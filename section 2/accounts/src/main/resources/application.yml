server:
  port: 8080
spring:
  application:
    name: accounts
  devtools:
    restart:
      enabled: true
  jpa:
    #database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: host.docker.internal
    port: 5672
    username: guest
    password: guest

  config:
    import: "configserver:http://myuser:mypassword@host.docker.internal:8071/"

  profiles:
    active: dev


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always




