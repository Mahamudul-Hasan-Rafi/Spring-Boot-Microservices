services:
  accounts:
    build:
      context: ./accounts
      dockerfile: Dockerfile
    container_name: accounts_ms
    ports:
      - 8080:8080
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 256M
    volumes:
      - ./accounts/logs:/app/accounts/logs
    networks:
      - eazybank_net

  loans:
    build:
      context: ./loans
      dockerfile: Dockerfile
    container_name: loans_ms
    ports:
      - 8090:8090
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 256M
    volumes:
      - ./loans/logs:/app/loans/logs
    networks:
      - eazybank_net

  cards:
    build:
      context: ./cards
      dockerfile: Dockerfile
    container_name: cards_ms
    ports:
      - 9000:9000
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 256M
    volumes:
      - ./cards/logs:/app/cards/logs
    networks:
      - eazybank_net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.8.0
    container_name: filebeat
    user: root
    entrypoint: >
      sh -c '
      cp /usr/share/filebeat/filebeat.yml /usr/share/filebeat/filebeat.yml.tmp &&
      chmod 600 /usr/share/filebeat/filebeat.yml.tmp &&
      chown root:filebeat /usr/share/filebeat/filebeat.yml.tmp &&
      exec filebeat -e -c /usr/share/filebeat/filebeat.yml.tmp
      '
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./accounts/logs:/app/accounts/logs:ro
      - ./loans/logs:/app/loans/logs:ro
      - ./cards/logs:/app/cards/logs:ro
    networks:
      - eazybank_net
    depends_on:
      - accounts
      - loans
      - cards

networks:
  eazybank_net:
    driver: bridge

