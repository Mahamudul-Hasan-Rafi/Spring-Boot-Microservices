server:
  port: 8080
spring:
  application:
    name: accounts
  devtools:
    restart:
      enabled: true
  jpa:
    #database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    #host: host.docker.internal
    host: 10.11.204.202
    port: 5672
    username: guest
    password: guest

  config:
    #import: optional:configserver:http://myuser:mypassword@localhost:8071/
    import: configserver:http://myuser:mypassword@host.docker.internal:8071/

  profiles:
    active: dev

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true


logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      springframework:
        cloud: DEBUG
        context: DEBUG
        amqp: DEBUG
        rabbit: DEBUG
    com:
      eazybank:
        accounts: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
    shutdown:
      access: unrestricted


eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      #defaultZone: http://localhost:8761/eureka/
      defaultZone: http://host.docker.internal:8761/eureka/

info:
  app:
    name: accounts
    description: Accounts Service
    version: 1.0.0

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10000
      eventConsumerBufferSize: 10
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true





